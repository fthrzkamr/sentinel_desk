# Edge reverse proxy — single entry point (port 80) for the whole stack.
# Routes API + WebSocket traffic to the backend, everything else to the
# frontend's own nginx (which serves the built Vue SPA).
#
# No TLS block here yet: SentinelDesk isn't deployed to a real domain, and a
# certificate is only meaningful once one exists. When it does, terminate
# TLS here (e.g. certbot-issued cert mounted into this container) and
# redirect this server block's traffic to it — the proxy rules below don't
# need to change, only the listen/ssl_certificate directives do.

upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }

    # Django Channels — needs the Upgrade/Connection headers explicitly,
    # nginx doesn't forward those for a plain proxy_pass on its own.
    location /ws/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
