server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints built asset filenames, so they're safe to cache
    # aggressively; index.html itself must always be revalidated or a
    # deploy's new asset hashes would never be picked up.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
